{{- define "main" }}
<div class="page-wrap">
  <h1 class="page-title">{{ .Title }}</h1>
  <ul class="terms-list">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
      <span class="count">({{ .Count }})</span>
    </li>
    {{- end }}
  </ul>
</div>
{{- end }}
